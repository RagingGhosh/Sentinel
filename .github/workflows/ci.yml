name: CI

on: [push, pull_request]

jobs:
  app:
    name: Application suite (runtime + tooling only)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-key
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # base + dev only. If an application import needs a training package,
      # this job fails — which is the point.
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy complaints domains ml accounts ingest
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Test
        run: pytest -m "not ml" --cov=complaints --cov=domains --cov=ml --cov-report=term-missing

  ml:
    name: ML suite (adds training dependencies)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-key
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements/train.txt -r requirements/dev.txt
      # Task 16 gave the 'ml' marker its first users, so the exit-code-5
      # tolerance that stood here is gone: an empty selection now means a
      # mis-typed marker, and the job must fail on it like any other error.
      - name: ML tests
        run: pytest -m ml

      # The corpus storage and manifest tests need pyarrow, which lives in
      # requirements/train.txt. They are deliberately NOT marked 'ml': that
      # marker means "exercises an ML model artifact", and Parquet IO does not.
      # Without this step they would run in neither job -- skipped in the app
      # job for want of pyarrow, and unselected by 'pytest -m ml' here.
      #
      # Selected by path rather than by a marker, so the selection stays narrow
      # and 'ml' keeps its meaning. No exit-code tolerance: these tests exist
      # today, so an empty selection (a renamed or deleted module) is a real
      # failure and pytest's exit 5 must fail the job.
      #
      # The import check first turns a missing pyarrow into a hard failure.
      # Otherwise importorskip would skip the whole module and the job would go
      # green having tested nothing -- the exact false pass this step fixes.
      - name: Corpus storage tests (require the training tier)
        run: |
          python -c "import pyarrow.parquet; print('pyarrow', pyarrow.__version__)"
          python -c "import numpy; print(numpy.__version__)"
          pytest tests/ingest/test_storage.py tests/ingest/test_manifest.py tests/ingest/test_cli.py tests/ingest/test_cfpb_outcomes.py tests/ml/training/test_features.py tests/ml/training/test_labels.py tests/ml/training/test_metrics.py tests/ml/training/test_artifacts.py
