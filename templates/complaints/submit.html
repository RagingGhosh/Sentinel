{% extends "base.html" %}

{% block title %}Submit a complaint - Sentinel{% endblock %}

{% block content %}
    <h1>Submit a complaint</h1>

    <form method="post" class="form" novalidate>
        {% csrf_token %}

        <div class="form-row">
            <label for="id_domain">Domain</label>
            <select name="domain" id="id_domain" required>
                <option value="" selected disabled>Choose a domain&hellip;</option>
                {% for domain in domains %}
                    <option value="{{ domain.pk }}">{{ domain.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <label for="id_title">Title</label>
            <input type="text" name="title" id="id_title" maxlength="300" required>
        </div>

        <div class="form-row">
            <label for="id_body">Description</label>
            <textarea name="body" id="id_body" rows="8" required></textarea>
        </div>

        <button type="submit">Submit complaint</button>
    </form>
{% endblock %}
